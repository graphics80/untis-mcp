# Nginx config for untis-mcp
# Place this file as: /etc/nginx/sites-available/untis-mcp
# Then: ln -s /etc/nginx/sites-available/untis-mcp /etc/nginx/sites-enabled/
# TLS: sudo certbot --nginx -d mcp.it.bzz.ch

server {
    listen 80;
    server_name mcp.it.bzz.ch;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mcp.it.bzz.ch;

    # TLS — filled in by certbot
    # ssl_certificate ...
    # ssl_certificate_key ...

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for SSE / streaming MCP responses
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for streaming MCP sessions
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable buffering — needed for SSE streaming
        proxy_buffering off;
        proxy_cache off;
    }
}
